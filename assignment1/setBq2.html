<html>
  <head>
    <title>Os info</title>
  </head>
  <body>
    <center><h1>Operating system information</h1></center>
    <label for="name">Enter your name</label>
    <input type="text" name="name" placeholder="name" id="name" /><br />
    <label for="passwd">Password</label>
    <input type="password" name="password" placeholder="password" id="passwd" />
    <br />
    <div>
      <h3>Which of the following Operating systems have you used:</h3>
      <input type="checkbox" name="linux" value="linux" />linux
      <input type="checkbox" name="windows10" value="windows" />Windows 10
      <input type="checkbox" name="Macintosh" value="Mac" />Macintosh
    </div>
    <div>
      <h3>Which of the Operating system do you like the most:</h3>
      <input type="radio" name="os" value="linux" />linux
      <input type="radio" name="os" value="windows" />Windows 10
      <input type="radio" name="os" value="Mac" />Macintosh
    </div>
    <br />
    You have completed the form
    <button type="submit">Sign up</button>
  </body>
</html>
